name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish create-igivafuk and igivafuk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build CLI
        run: npm run build -w create-igivafuk

      - name: Publish create-igivafuk
        run: npm publish -w create-igivafuk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish igivafuk
        run: npm publish -w igivafuk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
