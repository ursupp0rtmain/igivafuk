name: Publish to GitHub Packages

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish create-igivafuk and igivafuk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@ursupp0rtmain'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build CLI
        run: npm run build -w packages/create-igivafuk

      - name: Publish create-igivafuk
        run: npm publish -w packages/create-igivafuk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish igivafuk
        run: npm publish -w packages/igivafuk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
