name: Bug Report
description: Report a bug in create-igivafuk
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: create-igivafuk version
      placeholder: 0.1.0
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.x
